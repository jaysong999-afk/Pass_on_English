limit_req_zone $binary_remote_addr zone=auth_api:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name passonenglish.com www.passonenglish.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://passonenglish.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.passonenglish.com;

    ssl_certificate /etc/letsencrypt/live/passonenglish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passonenglish.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://passonenglish.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name passonenglish.com;

    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/passonenglish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passonenglish.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Supabase SSR sessions can return multiple chunked Set-Cookie headers when
    # tokens refresh. Keep enough upstream response-header capacity to avoid
    # `upstream sent too big header` turning a valid response into HTTP 502.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location ~* ^/(?:wp-admin|wp-login\.php|xmlrpc\.php|wordpress|wp|blog|cms)(?:/|$) {
        return 404;
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location ~ ^/api/(?:auth/login|student/account)$ {
        limit_req zone=auth_api burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 65s;
    }

    location ~* /\. {
        deny all;
    }
}
